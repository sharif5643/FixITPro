name: CI

# Runs on pull requests and is called by deploy.yml before every production deploy,
# so a red test stops the deploy instead of reaching customers.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (typecheck, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '123456'
          POSTGRES_DB: fixitpro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # defaults point at /app/* (the container), which the runner user cannot create
      LOGS_DIR: /tmp/fixitpro/logs
      UPLOADS_BASE_DIR: /tmp/fixitpro/uploads
      BACKUP_DIR: /tmp/fixitpro/backups
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest --ci
      # e2e uses the test database at postgres:123456@localhost:5432/fixitpro_test (jest.e2e.config.ts)
      - run: npx jest --config jest.e2e.config.ts --runInBand --forceExit --ci

  web:
    name: Web (typecheck, lint, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npx vitest run
