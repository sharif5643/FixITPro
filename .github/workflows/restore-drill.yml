name: Backup restore drill

# Manual only (Actions → "Backup restore drill" → Run workflow).
# Also installs the current scripts/backup/pg_backup_coolify.sh used by the server's daily cron.
# Restores the newest database backup into a temporary database on the server, compares
# it with the live database and drops it again. Production data is only read.
on:
  workflow_dispatch:
    inputs:
      backup_first:
        description: Take a fresh backup before the drill
        type: boolean
        default: true

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/known_hosts << 'EOF'
          |1|QXt+ufjmCnRMQgRYn79oNLOLCMk=|MbbxthlQVmKY3M5MBmDVm1r6rk4= ssh-rsa 
          |1|DvsnTBCxLHm8F065S5GQgbFtQ7A=|p3bzmY/gf4hK9k12IVBMYJRUmW0= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJXdI/T+EG5TAdAn1+taAQ11ZngzxKD1IfntVnXaH9du
          |1|ibmwetm0PAiC8BgSyTtf4uTAKd8=|eE9sCjfTwZLn5uRd6FLxn8RF2do= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLrzre/wkU0criEqkVfDAb3Dx1xjcWhPtoWGVXr7hKPyWz32Zd5rIuLBoqRrf+Llc9ODEUj6Zumb/3ummYQCjHc=
          EOF

      - name: Install backup + drill scripts
        # pg_backup_coolify.sh is also what the server's daily cron runs; the old copy is kept as
        # pg_backup_coolify.sh.bak-<date> next to it.
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 root@91.98.151.10 \
            'cd /opt/fixitpro-backups && [ ! -f pg_backup_coolify.sh ] || cp -p pg_backup_coolify.sh "pg_backup_coolify.sh.bak-$(date +%Y%m%d%H%M%S)"'
          scp -i ~/.ssh/deploy_key -o ConnectTimeout=30 \
            scripts/backup/pg_backup_coolify.sh scripts/backup/pg_restore_verify.sh \
            root@91.98.151.10:/opt/fixitpro-backups/

      - name: Ensure the nightly server backup is scheduled
        # Second, independent layer next to the app's own 03:00 backup: the host cron the docs
        # describe was not installed (found 2026-10-03; owner approved installing it).
        # Idempotent: adds the line only if missing. 20:30 UTC = 03:30 Bangkok.
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 root@91.98.151.10 '
            line="30 20 * * * /bin/bash /opt/fixitpro-backups/pg_backup_coolify.sh >> /opt/fixitpro-backups/cron.log 2>&1"
            if crontab -l 2>/dev/null | grep -qF "pg_backup_coolify.sh"; then
              echo "backup cron already present"
            else
              (crontab -l 2>/dev/null; echo "# FixITPro nightly DB backup (03:30 Bangkok)"; echo "$line") | crontab -
              echo "backup cron installed"
            fi
            crontab -l | grep -F "pg_backup_coolify.sh"
          '

      - name: Backup schedule and recent backups (read-only)
        # Shows whether the nightly backup is scheduled and actually ran, before this run adds one.
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 root@91.98.151.10 '
            echo "--- cron entries for backups (crontab -l, /etc/cron.d) ---"
            (crontab -l 2>/dev/null; cat /etc/cron.d/* 2>/dev/null) | grep -i "pg_backup\|fixitpro-backups" || echo "NO BACKUP CRON ENTRY FOUND"
            echo "--- server time: $(date) / Bangkok: $(TZ=Asia/Bangkok date) ---"
            echo "--- newest database backups ---"
            ls -lt --time-style=+"%Y-%m-%d %H:%M %Z" /opt/fixitpro-backups/db/*.sql.gz 2>/dev/null | head -10 || echo "no backups found"
            echo "--- last lines of the backup log ---"
            tail -n 5 /opt/fixitpro-backups/backup.log 2>/dev/null || ls /opt/fixitpro-backups/*.log 2>/dev/null
            echo "--- LINE usage (counts only) ---"
            pg=$(docker ps --format "{{.Names}}" | grep "^postgres-z9m1c1i9nr6kbyo4qn0vuv1b" | head -1)
            echo "shops with LINE notify on | customers linked to LINE:"
            [ -n "$pg" ] && docker exec "$pg" psql -U fixitpro -d fixitpro -Atc "SELECT COUNT(*) FILTER (WHERE \"lineNotifyEnabled\"), (SELECT COUNT(*) FROM \"Customer\" WHERE \"lineUserId\" IS NOT NULL) FROM \"ShopSettings\"" || true
            echo "--- shop settings rows: id | belongs to a shop | updated (no names) ---"
            [ -n "$pg" ] && docker exec "$pg" psql -U fixitpro -d fixitpro -Atc "SELECT id, (\"tenantId\" IS NOT NULL), \"updatedAt\" FROM \"ShopSettings\" ORDER BY id LIMIT 5" || true
            echo "--- backend containers and their volumes (all, incl. stopped) ---"
            for c in $(docker ps -a --format "{{.Names}}" | grep -i backend); do
              echo "$c: $(docker inspect -f "{{.State.Status}} created={{.Created}}" "$c")"
              docker inspect -f "{{range .Mounts}}  {{.Destination}} <- {{.Name}}{{.Source}}{{println}}{{end}}" "$c"
            done
            echo "--- docker volumes for uploads/backups ---"
            docker volume ls --format "{{.Name}}" | grep -iE "upload|backup" || true
            echo "--- in-app nightly backup (backend container, /app/backups) ---"
            for c in $(docker ps --format "{{.Names}}" | grep -i backend); do
              echo "container: $c"
              docker exec "$c" sh -c "ls -lt /app/backups 2>/dev/null | head -8" || true
              docker logs --since 48h "$c" 2>&1 | grep -i "\[Scheduled\]" | tail -n 6 || true
            done
          '

      - name: Fresh backup
        if: ${{ inputs.backup_first }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@91.98.151.10 "bash /opt/fixitpro-backups/pg_backup_coolify.sh"

      - name: Restore drill
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@91.98.151.10 "bash /opt/fixitpro-backups/pg_restore_verify.sh"
