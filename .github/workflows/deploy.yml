name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to fixitpro.in.th
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/known_hosts << 'EOF'
          |1|QXt+ufjmCnRMQgRYn79oNLOLCMk=|MbbxthlQVmKY3M5MBmDVm1r6rk4= ssh-rsa 
          |1|DvsnTBCxLHm8F065S5GQgbFtQ7A=|p3bzmY/gf4hK9k12IVBMYJRUmW0= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJXdI/T+EG5TAdAn1+taAQ11ZngzxKD1IfntVnXaH9du
          |1|ibmwetm0PAiC8BgSyTtf4uTAKd8=|eE9sCjfTwZLn5uRd6FLxn8RF2do= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLrzre/wkU0criEqkVfDAb3Dx1xjcWhPtoWGVXr7hKPyWz32Zd5rIuLBoqRrf+Llc9ODEUj6Zumb/3ummYQCjHc=
          EOF

      # The server's deploy script copies its settings from the running backend: when nothing is
      # running (a deploy that ended with every container stopped), start the newest ones first.
      - name: Make sure the app is running before deploying
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 root@91.98.151.10 'sh -s' < scripts/deploy/recover-app.sh

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@91.98.151.10 \
            "bash /root/trigger-coolify-deploy.sh" 2>&1

      - name: Verify deployment
        id: verify
        continue-on-error: true
        run: |
          echo "Waiting for containers to be healthy..."
          sleep 20
          MAX_WAIT=300
          ELAPSED=0
          STATUS="000"
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # curl exits non-zero on timeout while containers restart; keep polling instead of
            # letting `bash -e` abort the step (that made every deploy show as failed)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fixitpro.in.th/login --max-time 10 || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deploy complete! Commit: ${{ github.sha }}"
              exit 0
            fi
            echo "Waiting... HTTP $STATUS (${ELAPSED}s/${MAX_WAIT}s)"
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done
          echo "❌ Verification failed — HTTP $STATUS"
          exit 1

      # Outage of 2026-10-08: Coolify redeployed by itself during this deploy and every app
      # container ended up stopped. If the site is not up, start the newest containers again
      # (no rebuild, no data change) and check once more; the job fails if it is still down.
      - name: Recover the site if it did not come up
        if: steps.verify.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 root@91.98.151.10 'sh -s' < scripts/deploy/recover-app.sh
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://fixitpro.in.th/login --max-time 10 || true)
            echo "login page: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "❌ Site still down after recovery"
          exit 1

      # A deploy starts a new web container, and the Android apps published to /download
      # (android-apps.yml) did not survive it. The server keeps the last published files in
      # /root/fixitpro-android/out; copy them into the new container. Only these three files
      # are copied, and a failure here only warns: the site itself is already up.
      - name: Put the Android apps back on /download
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 root@91.98.151.10 'set -e
            OUT=/root/fixitpro-android/out
            [ -f "$OUT/apps.json" ] || { echo "No apps published yet"; exit 0; }
            c=$(docker ps --format "{{.Names}}" | grep "^frontend-z9m1c1i9nr6kbyo4qn0vuv1b" | head -1)
            [ -n "$c" ] || { echo "frontend container not found"; exit 1; }
            for f in FixITPro-POS.apk FixITPro-Staff.apk apps.json; do
              docker cp "$OUT/$f" "$c:/app/public/downloads/$f.tmp"
              docker exec -u 0 "$c" sh -c "chmod 644 /app/public/downloads/$f.tmp && mv /app/public/downloads/$f.tmp /app/public/downloads/$f"
            done
            echo "Android apps restored into $c"' \
          || echo "::warning::Android apps not restored on /download — run the Android apps workflow"
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fixitpro.in.th/downloads/apps.json --max-time 30 || true)
          echo "apps.json → HTTP $code"
